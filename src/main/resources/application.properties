spring.application.name=identity-access-management-system
server.port=${SERVER_PORT:8080}
server.error.include-message=never
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:identity-access-management-system-development-secret-key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.datasource.url=jdbc:h2:mem:iamdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.data.web.pageable.max-page-size=100
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.health.mail.enabled=false
spring.flyway.enabled=true
iam.mfa.encryption-key=${MFA_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
iam.public-base-url=${IAM_PUBLIC_BASE_URL:http://localhost:8080}
iam.email.from=${MAIL_FROM:no-reply@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
iam.security.login.max-failures=${IAM_LOGIN_MAX_FAILURES:5}
iam.security.login.window=${IAM_LOGIN_WINDOW:PT15M}
iam.security.login.lock-duration=${IAM_LOGIN_LOCK_DURATION:PT15M}
iam.security.email.max-requests=${IAM_EMAIL_ACTION_MAX_REQUESTS:5}
iam.security.email.window=${IAM_EMAIL_ACTION_WINDOW:PT1H}
iam.security.email.block-duration=${IAM_EMAIL_ACTION_BLOCK_DURATION:PT1H}
iam.security.session.refresh-lifetime=${IAM_REFRESH_TOKEN_LIFETIME:PT720H}
iam.security.trusted-proxies=${IAM_TRUSTED_PROXIES:}
springdoc.api-docs.enabled=${IAM_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${IAM_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
