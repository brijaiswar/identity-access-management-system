spring.application.name=identity-access-management-system
server.port=${SERVER_PORT:8080}
server.error.include-message=never
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:identity-access-management-system-development-secret-key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.datasource.url=jdbc:h2:mem:iamdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.flyway.enabled=true
