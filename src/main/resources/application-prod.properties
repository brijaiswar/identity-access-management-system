spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health,info
iam.registration.enabled=false
iam.mfa.encryption-key=${MFA_ENCRYPTION_KEY}
iam.public-base-url=${IAM_PUBLIC_BASE_URL}
iam.email.from=${MAIL_FROM}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
springdoc.api-docs.enabled=${IAM_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${IAM_API_DOCS_ENABLED:false}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
